[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kreview"
dynamic = ["version"]
description = "Evaluate cfDNA fragmentomics features for ctDNA detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
authors = [{name = "Ronak Shah", email = "shahr2@mskcc.org"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = [
    "pandas>=2.0.0,<3",
    "numpy>=1.24.0,<3",  # <3: cap major bumps (NumPy 2.0 removed np.NaN and broke deps before)
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "duckdb>=0.10.0",
    "pyarrow>=14.0.0",
    "structlog>=23.1.0",
    "typer>=0.9.0",
    "plotly>=5.14.0",
    "kaleido>=0.2.1",  # For static plot fallbacks
    "great_tables>=0.15.0",  # Column-grouped tables (reactable-style)
    "shap>=0.40.0",
    "joblib>=1.3.0",
    "statsmodels>=0.14.0",
    "xgboost>=2.0.0",
    "mrmr-selection>=0.2.8",
]

[project.optional-dependencies]
# NOTE (#96): the `arfs` and `legacy-boruta` extras are MUTUALLY EXCLUSIVE —
# BorutaShapPlus pins numpy<=2.0.0 while arfs 3.0 requires numpy>=2.0.2, so pip
# refuses any environment containing both. `arfs` is the supported selector
# family (GrootCV/Leshy, shipped in the containers); `legacy-boruta` exists only
# to reproduce pre-#96 boruta_shap runs.
arfs = [
    "arfs>=3.0.0",  # 3.0: works with modern sklearn/lightgbm (2.4 did not — #91)
    "lightgbm>=4.0.0",
    # arfs imports the deprecated `pkg_resources`, which setuptools 81 removed. Pin below that
    # so `import arfs` works on Python 3.12+ (a clean 3.12 venv ships no pkg_resources at all).
    "setuptools<81",
]
legacy-boruta = [
    "BorutaShapPlus>=0.1.3",  # deprecated selector (#96); numpy<=2.0.0 — conflicts with arfs
]
jupyter = [
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0"
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]
dev = [
    # PINNED EXACTLY — these two generate committed source. nbdev writes kreview/*.py from
    # nbs/*.ipynb and black then formats it, so a version difference between a developer's
    # machine and CI produces a different tree and the export-sync gate fails on nothing.
    # That is exactly what happened: CI's unpinned `pip install nbdev` pulled 3.3.0 (which
    # appends a "Docs:" line to module docstrings) while local had 3.0.12. Bump both here
    # deliberately, then re-run `nbdev-export && black kreview/` and commit the result.
    "nbdev==3.3.0",
    "black[jupyter]==26.5.1",
    "ruff==0.15.4",  # PINNED like nbdev/black: lint gates CI, and an unpinned ruff broke
                     # lint on untouched code when 0.16 shipped new default rules (PR #99).
                     # To upgrade: bump the pin, fix new findings, commit together.
    "mypy==2.3.1"  # PINNED like ruff/black/nbdev (see #99/#102): lint gates CI
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-typer>=0.0.3",
    "mike>=2.0.0",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-git-revision-date-localized-plugin>=1.5.1",
    "mkdocs-panzoom-plugin>=0.5.2",
    "mkdocs-pdf>=0.1.2"
]
gpu = [
    "torch>=2.0",
    "tabpfn>=8.0.3",
    "shapiq",
    "tabicl[finetune,shap]>=2.1",
]
# `all` = every CPU-installable extra (arfs + jupyter + test + dev + docs).
# `gpu` is deliberately NOT included: it pulls torch/tabpfn/tabicl and needs CUDA.
# Install GPU support explicitly with `pip install kreview[all,gpu]`.
all = [
    "arfs>=3.0.0",  # 3.0 (see arfs extra note; legacy-boruta deliberately excluded — conflicts)
    "lightgbm>=4.0.0",
    "setuptools<81",   # arfs needs the deprecated pkg_resources (removed in setuptools 81)
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black[jupyter]>=23.0.0",
    "ruff==0.15.4",  # PINNED like nbdev/black: lint gates CI, and an unpinned ruff broke
                     # lint on untouched code when 0.16 shipped new default rules (PR #99).
                     # To upgrade: bump the pin, fix new findings, commit together.
    "mypy==2.3.1",  # PINNED like ruff/black/nbdev (see #99/#102): lint gates CI
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-typer>=0.0.3",
    "mike>=2.0.0",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-git-revision-date-localized-plugin>=1.5.1",
    "mkdocs-panzoom-plugin>=0.5.2",
    "mkdocs-pdf>=0.1.2"
]

[project.urls]
Repository = "https://github.com/msk-access/kreview"
Documentation = "https://msk-access.github.io/kreview"

[project.scripts]
kreview = "kreview.cli:app"

[project.entry-points.nbdev]
kreview = "kreview._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "kreview.__version__"}

[tool.setuptools]
include-package-data = true
packages = ["kreview", "kreview.features", "kreview.templates"]

[tool.setuptools.package-data]
"*" = ["*.qmd", "*.css", "*.js", "*.html"]

[tool.ruff.lint]
# E402: module-level import not at top — unavoidable in nbdev-generated code
# F401: imported but unused — nbdev re-exports in __all__ cause this
# E501: line too long — relaxed for readability in data pipelines
# E712: comparison to True/False — pandas boolean indexing uses == True
# E741: ambiguous variable name — some short vars are standard in ML code (X, y, e)
# E701: multiple statements on one line — occasional nbdev pattern
ignore = ["E402", "F401", "E501", "E712", "E741", "E701"]

[tool.ruff.lint.per-file-ignores]
# nbdev test cells reference classes from prior export cells (F821),
# and nbdev splits imports across cells causing redefinitions (F811).
"nbs/**/*.ipynb" = ["F821", "F811"]

[tool.black]
target-version = ["py310"]
# Notebooks are formatted by nbdev_clean, not black directly.
# Running black --check on .ipynb files causes CI flakiness across black versions.
extend-exclude = '''
(
  \.ipynb
)
'''


[tool.nbdev]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["arg-type", "assignment", "var-annotated", "misc", "return-value", "attr-defined", "call-overload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--tb=short",
    "-q",
]
# Coverage: run explicitly in CI or locally:
#   pytest --cov=kreview --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered
timeout = 120
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["kreview"]
omit = [
    "kreview/_modidx.py",
    "kreview/templates/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]
show_missing = true
