name: Docs
on:
  push:
    branches: [main, develop]
  # Docs are verified on pull requests too. Until now the only thing that touched
  # mkdocs in CI was the deploy below, which runs after merge and without --strict —
  # so `mkdocs build --strict` sat in the release guide as a manual step and rotted
  # through two releases while nothing enforced it.
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**.md'
      - 'kreview/**'        # docstrings feed mkdocstrings; code can break the build
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Build-only gate: fails on the broken links and missing annotations that
  # --strict catches, without deploying anything.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]
      - name: Build docs (strict)
        run: mkdocs build --strict

  docs:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Deploy development docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          mike deploy --push --update-aliases dev develop

      - name: Deploy stable docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep '^version =' settings.ini | cut -d '=' -f 2 | tr -d ' ')
          mike deploy --push --update-aliases "$VERSION" stable
          mike set-default --push stable

      - name: Checkout newly built gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-export
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-export
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
